name: Genera index completo Dalla Simo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  genera-index:
    if: ${{ !contains(github.event.head_commit.message, '[generated-index]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Ricompone e verifica l'app completa
        shell: bash
        run: |
          set -euo pipefail
          cat fixed/p01a fixed/p01b fixed/p01c fixed/p01d \
              app.part02 app.part03 app.part04 app.part05 app.part06 app.part07 \
              fixed/p08_1 fixed/p08_2a fixed/p08_2b fixed/p08_3 fixed/p08_4 fixed/p08_5 fixed/p08_6 fixed/p08_7 fixed/p08_8 \
              app.part09 app.part10 app.part11 | tr -d '\n\r ' | base64 -d | gzip -d > index.html
          test -s index.html
          test "$(wc -c < index.html)" -ge 230000
          grep -q "Dalla Simo" index.html
          grep -qi "<!doctype html" index.html

          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href="./manifest.webmanifest"','href="./manifest.webmanifest?v=20260907c"')
          s=s.replace('href="./icon-192.png"','href="./icon-192.png?v=20260907c"')
          s=s.replace('href="logo-dalla-simo.png"','href="./icon-192.png?v=20260907c"')
          s=s.replace('src="./icon-512.png"','src="./icon-512.png?v=20260907c"')
          s=s.replace('.brand-logo{width:48px;height:48px;object-fit:contain;flex:0 0 auto}', '.brand-logo{width:48px;height:48px;object-fit:contain;object-position:center;padding:7px;flex:0 0 auto;background:#f7f5ef;border-radius:12px}')
          s=s.replace('.hero-logo{width:110px;height:110px;object-fit:contain;display:block;margin:0 auto 8px}', '.hero-logo{width:128px;height:128px;object-fit:contain;object-position:center;padding:18px;display:block;margin:0 auto 8px;background:#f7f5ef;border-radius:24px}')
          p.write_text(s,encoding='utf-8')
          PY
          echo "INDEX_OK bytes=$(wc -c < index.html)"

      - name: Pubblica index.html completo su main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html già aggiornato"
            exit 0
          fi
          git commit -m "[generated-index] Pubblica Dalla Simo completa"
          git push
