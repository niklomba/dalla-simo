name: Verifica manuale Dalla Simo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
      - name: Verifica file principali
        run: |
          test -s index.html
          test -s domain-core.js
          test -s domain-core-v113.js
          test -s brand-v111-512.png
          test -s icon-192-v112.png
          test -s icon-512-v112.png
          grep -q 'domain-core-v113.js' domain-core.js
