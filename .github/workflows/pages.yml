name: Pubblica Dalla Simo v1.20

on:
  push:
    branches: ["main", "feat/v120-five-diet-plans"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-v120:
    if: ${{ !contains(github.event.head_commit.message, '[generated-v120]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Prepara Dalla Simo v1.20
        shell: bash
        run: |
          set -euo pipefail
          for f in domain-core-v113.js domain-core-v114.js domain-core-v116.js domain-core-v117.part1 domain-core-v117.part2 domain-core-v117.part3 domain-core-v117-search-scanner.js domain-core-v117-product-resolver.js domain-core-v117-qr-resolver.js domain-core-v117-discard-ui.js domain-core-v117-spesa-actions.js domain-core-v118-recipes.js domain-core-v118-ui.js domain-core-v119-recipes.js domain-core-v119-family-nutrition.js domain-core-v120-diet-plans.js; do test -s "$f"; done
          cat domain-core-v117.part1 domain-core-v117.part2 domain-core-v117.part3 > domain-core-v117.js
          for f in domain-core-v113.js domain-core-v114.js domain-core-v116.js domain-core-v117.js domain-core-v117-search-scanner.js domain-core-v117-product-resolver.js domain-core-v117-qr-resolver.js domain-core-v117-discard-ui.js domain-core-v117-spesa-actions.js domain-core-v118-recipes.js domain-core-v118-ui.js domain-core-v119-recipes.js domain-core-v119-family-nutrition.js domain-core-v120-diet-plans.js; do node --check "$f"; done

          cat > domain-core.js <<'JS'
          // Loader Dalla Simo v1.20
          (function(){
            function carica(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error('Impossibile caricare '+src));document.head.appendChild(s)})}
            carica('./domain-core-v113.js?v=120')
              .then(()=>carica('./domain-core-v114.js?v=120'))
              .then(()=>carica('./domain-core-v118-recipes.js?v=120'))
              .then(()=>carica('./domain-core-v119-recipes.js?v=120'))
              .then(()=>carica('./domain-core-v116.js?v=120'))
              .then(()=>carica('./domain-core-v117.js?v=120'))
              .then(()=>carica('./domain-core-v117-search-scanner.js?v=120'))
              .then(()=>carica('./domain-core-v117-product-resolver.js?v=120'))
              .then(()=>carica('./domain-core-v117-qr-resolver.js?v=120'))
              .then(()=>carica('./domain-core-v117-discard-ui.js?v=120'))
              .then(()=>carica('./domain-core-v117-spesa-actions.js?v=120'))
              .then(()=>carica('./domain-core-v118-ui.js?v=120'))
              .then(()=>carica('./domain-core-v119-family-nutrition.js?v=120'))
              .then(()=>carica('./domain-core-v120-diet-plans.js?v=120'))
              .then(()=>{document.title='App Alimentazione — Dalla Simo v1.20';const sub=document.querySelector('.brand-subtitle');if(sub)sub.textContent='Alimentazione familiare · v1.20';const rsub=document.querySelector('#ricette .sub');if(rsub&&window.__DALLA_SIMO_RECIPES_V119__)rsub.textContent='Archivio locale · '+window.__DALLA_SIMO_RECIPES_V119__.total+' ricette/versioni uniche · '+window.__DALLA_SIMO_RECIPES_V119__.uniqueNames+' piatti distinti';window.__DALLA_SIMO_BUILD__='v1.20';console.log('Dalla Simo v1.20 attiva')})
              .catch(e=>console.error('Dalla Simo v1.20:',e));
          })();
          JS

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'<title>.*?</title>','<title>App Alimentazione — Dalla Simo v1.20</title>',s,count=1,flags=re.S)
          s=re.sub(r'Alimentazione familiare · v\d+\.\d+','Alimentazione familiare · v1.20',s)
          s=s.replace('Archivio locale dimostrativo · 247 ricette','Archivio locale · conteggio aggiornato al caricamento')
          s=re.sub(r'\s*<script\s+src=["\']\./domain-core\.js(?:\?v=\d+)?["\']\s*></script>\s*','\n',s,flags=re.I)
          s=s.replace('</body>','<script src="./domain-core.js?v=120"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY

          cat > service-worker.js <<'JS'
          const C='dalla-simo-v120-20260911-five-diet-plans';
          const A=['./','./index.html','./manifest.webmanifest','./domain-core.js?v=120','./domain-core-v113.js?v=120','./domain-core-v114.js?v=120','./domain-core-v118-recipes.js?v=120','./domain-core-v119-recipes.js?v=120','./domain-core-v116.js?v=120','./domain-core-v117.js?v=120','./domain-core-v117-search-scanner.js?v=120','./domain-core-v117-product-resolver.js?v=120','./domain-core-v117-qr-resolver.js?v=120','./domain-core-v117-discard-ui.js?v=120','./domain-core-v117-spesa-actions.js?v=120','./domain-core-v118-ui.js?v=120','./domain-core-v119-family-nutrition.js?v=120','./domain-core-v120-diet-plans.js?v=120','./brand-v111-512.png','./icon-192-v112.png','./icon-512-v112.png','./apple-touch-icon-v112.png'];
          self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.addAll(A)))});
          self.addEventListener('activate',e=>e.waitUntil(Promise.all([self.clients.claim(),caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x))))])));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const n=e.request.mode==='navigate';if(n){e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(C).then(x=>x.put('./index.html',c));return r}).catch(()=>caches.match('./index.html')));return}e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(x=>{const y=x.clone();caches.open(C).then(c=>c.put(e.request,y));return x})))});
          JS

      - name: Verifica v1.20
        shell: bash
        run: |
          set -euo pipefail
          node --check domain-core.js
          node --check domain-core-v120-diet-plans.js
          grep -q 'Dalla Simo v1.20' index.html
          grep -q 'domain-core-v120-diet-plans.js?v=120' domain-core.js
          grep -q 'conteggio aggiornato al caricamento' index.html

          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const m=html.match(/const RICETTE=(\[[\s\S]*?\]);\s*const KEY=/);if(!m)throw new Error('RICETTE base non trovate');
          const base=JSON.parse(m[1]);
          const context={RICETTE:base,window:null,document:{querySelector:()=>null},setTimeout:()=>{}};context.window=context;vm.createContext(context);
          vm.runInContext(fs.readFileSync('domain-core-v118-recipes.js','utf8'),context);
          vm.runInContext(fs.readFileSync('domain-core-v119-recipes.js','utf8'),context);
          const N=v=>String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
          const keys=context.RICETTE.map(r=>N(r.nome)+'|'+N(r.variante||'classica'));
          if(new Set(keys).size!==context.RICETTE.length)throw new Error('Doppioni ricette residui');
          if(context.RICETTE.length<1500)throw new Error('Totale ricette sotto 1500');
          console.log('RICETTE_UNICHE='+context.RICETTE.length);
          NODE

          node - <<'NODE'
          global.window=global;
          global.st={membri:[{id:'m1',nome:'Nicola'},{id:'m2',nome:'Simona'}],pianiPersona:{},v113:{modalitaMenu:'base',membroDieta:'m2'},v119Nutrizione:{obiettivi:{}},registro:[]};
          global.save=()=>{};global.openModal=()=>{};global.renderSettimana=()=>{};global.renderRegistro=()=>{};global.renderConsigli=()=>{};global.document={getElementById:()=>null};global.toast=()=>{};
          require('./domain-core-v120-diet-plans.js');
          const v=global.__DALLA_SIMO_DIETS_V120__;
          if(!v||v.version!=='1.20')throw new Error('Metadata v1.20 assente');
          if(v.simona.weeks!==5||v.simona.days!==35||!v.simona.allDaysWithinTolerance)throw new Error('Piani Simona non validi');
          if(v.nicola.weeks!==5||v.nicola.days!==35||!v.nicola.allDaysWithinTolerance)throw new Error('Piani Nicola non validi');
          if(!v.simona.balancedMixAvailable||!v.nicola.balancedMixAvailable)throw new Error('Mix bilanciato non disponibile');
          console.log('SIMONA_FREQ_FONTI='+JSON.stringify(v.simona.sourceWeeksFrequencyExact));
          console.log('NICOLA_FREQ_FONTI='+JSON.stringify(v.nicola.sourceWeeksFrequencyExact));
          global.mischiaSettimana120('m2');global.mischiaSettimana120('m1');
          if(!st.pianiPersona.m2||!st.pianiPersona.m1)throw new Error('Sincronizzazione piani fallita');
          NODE

          grep -q 'Mischia settimana' domain-core-v120-diet-plans.js
          grep -q 'Cambia menu giornaliero' domain-core-v120-diet-plans.js
          grep -q 'Cambia pranzo' domain-core-v120-diet-plans.js
          grep -q 'Frequenze della settimana' domain-core-v120-diet-plans.js
          grep -q 'Pesce spada occasionale' domain-core-v120-diet-plans.js
          grep -q 'ingredientiPreferiti' domain-core-v119-family-nutrition.js
          grep -q 'Consumo reale del giorno' domain-core-v119-family-nutrition.js
          grep -q 'ripristinaComprato117' domain-core-v117-spesa-actions.js
          grep -q '__DALLA_SIMO_QR_ROUTER__' domain-core-v117-qr-resolver.js

      - name: Pubblica v1.20
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html domain-core.js domain-core-v117.js service-worker.js
          if git diff --cached --quiet; then echo "v1.20 già aggiornata"; exit 0; fi
          git commit -m "[generated-v120] Pubblica Dalla Simo v1.20"
          git push
