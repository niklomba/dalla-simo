name: Pubblica Dalla Simo v1.10

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-v110:
    if: ${{ !contains(github.event.head_commit.message, '[generated-v110]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Prepara Pillow
        run: python -m pip install --quiet pillow

      - name: Genera branding e PWA v1.10
        shell: bash
        run: |
          set -euo pipefail
          test -s icon-master-v3.png
          test -s index.html
          test -s domain-core.js

          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import json, re

          BG=(247,245,239)
          src=Image.open('icon-master-v3.png').convert('RGB')
          px=src.load()
          mask=Image.new('L',src.size,0)
          mp=mask.load()
          w,h=src.size
          for y in range(h):
              for x in range(w):
                  r,g,b=px[x,y]
                  spread=max(r,g,b)-min(r,g,b)
                  dark=min(r,g,b)<185
                  saturated=spread>24
                  mp[x,y]=255 if (dark or saturated) else 0
          bbox=mask.getbbox()
          art=src.crop(bbox) if bbox else src.copy()
          pad=max(2,int(max(art.size)*0.008))
          art=ImageOps.expand(art,border=pad,fill=BG)

          def square(size,ratio,path):
              canvas=Image.new('RGB',(size,size),BG)
              target=max(1,int(size*ratio))
              im=art.copy()
              scale=target/max(im.size)
              nw=max(1,int(im.width*scale)); nh=max(1,int(im.height*scale))
              im=im.resize((nw,nh),Image.Resampling.LANCZOS)
              x=(size-nw)//2; y=(size-nh)//2
              canvas.paste(im,(x,y))
              canvas.save(path,'PNG',optimize=True)

          # App: quasi tutto il riquadro. Home: ancora più piena nel cerchio.
          square(512,1.18,'brand-v110-512.png')
          square(512,1.28,'icon-512-v110.png')
          square(192,1.28,'icon-192-v110.png')
          square(180,1.28,'apple-touch-icon-v110.png')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<title>.*?</title>', '<title>App Alimentazione — Dalla Simo v1.10</title>', s, count=1)
          s=re.sub(r'<link rel="manifest" href="[^"]+">', '<link rel="manifest" href="./manifest.webmanifest?v=110">', s, count=1)
          s=re.sub(r'<link rel="icon" type="image/png" href="[^"]+">', '<link rel="icon" type="image/png" href="./icon-192-v110.png?v=110">', s, count=1)
          s=re.sub(r'<link rel="apple-touch-icon" href="[^"]+">', '<link rel="apple-touch-icon" href="./apple-touch-icon-v110.png?v=110">', s)
          s=re.sub(r'\.brand-logo\{[^}]*\}', '.brand-logo{width:126px;height:100px;object-fit:cover;object-position:center;flex:0 0 auto;display:block;border-radius:18px}', s)
          s=re.sub(r'\.brand-title\{[^}]*\}', '.brand-title{font-size:28px;font-weight:900;line-height:1}', s)
          s=re.sub(r'\.brand-subtitle\{[^}]*\}', '.brand-subtitle{font-size:13px;color:var(--muted);margin-top:5px}', s)
          s=re.sub(r'\.hero-logo\{[^}]*\}', '.hero-logo{width:100%;height:auto;max-width:560px;object-fit:cover;object-position:center;display:block;margin:0 auto 8px;border-radius:18px}', s)
          s=re.sub(r'\.brand-home\{[^}]*\}', '.brand-home{text-align:center;padding:0;margin:0 -8px 10px}', s)
          s=re.sub(r'<img class="brand-logo" src="[^"]+"', '<img class="brand-logo" src="./brand-v110-512.png?v=110"', s)
          s=re.sub(r'<img class="hero-logo" src="[^"]+"', '<img class="hero-logo" src="./brand-v110-512.png?v=110"', s)
          s=re.sub(r'Alimentazione familiare · v1\.[0-9]+', 'Alimentazione familiare · v1.10', s)
          p.write_text(s,encoding='utf-8')

          manifest={
            'id':'./?pwa=dalla-simo-v110',
            'name':'Dalla Simo — Alimentazione familiare',
            'short_name':'Dalla Simo',
            'description':'Dieta completa, ricette, ricetta rapida, planner e spesa familiare.',
            'lang':'it-IT','start_url':'./?pwa=dalla-simo-v110','scope':'./','display':'standalone',
            'orientation':'portrait-primary','background_color':'#F7F5EF','theme_color':'#5F7D63',
            'prefer_related_applications':False,
            'icons':[
              {'src':'./icon-192-v110.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'./icon-512-v110.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')

          sw="""const C='dalla-simo-v110-20260908';
          const A=['./','./index.html','./manifest.webmanifest','./domain-core.js','./domain-core-v19.part1','./domain-core-v19.part2','./domain-core-v19.part3','./domain-core-v19.part4','./brand-v110-512.png','./icon-192-v110.png','./icon-512-v110.png','./apple-touch-icon-v110.png'];
          self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.addAll(A)))});
          self.addEventListener('activate',e=>e.waitUntil(Promise.all([self.clients.claim(),caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x))))])));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const n=e.request.mode==='navigate';if(n){e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(C).then(x=>x.put('./index.html',c));return r}).catch(()=>caches.match('./index.html')));return;}e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(x=>{const y=x.clone();caches.open(C).then(c=>c.put(e.request,y));return x}))) });
          """
          Path('service-worker.js').write_text(sw,encoding='utf-8')
          PY

      - name: Verifica v1.10
        run: |
          file brand-v110-512.png icon-192-v110.png icon-512-v110.png apple-touch-icon-v110.png
          grep -q 'dalla-simo-v110' manifest.webmanifest
          grep -q 'Dalla Simo v1.10' index.html
          grep -q 'brand-v110-512.png' index.html

      - name: Pubblica v1.10
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest service-worker.js brand-v110-512.png icon-192-v110.png icon-512-v110.png apple-touch-icon-v110.png
          if git diff --cached --quiet; then
            echo "v1.10 già aggiornata"
            exit 0
          fi
          git commit -m "[generated-v110] Pubblica Dalla Simo v1.10"
          git push
