name: Genera Dalla Simo completa

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  genera-app:
    if: ${{ !contains(github.event.head_commit.message, '[generated-v3]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Prepara Pillow
        run: python -m pip install --quiet pillow

      - name: Ricompone app e genera icone v3
        shell: bash
        run: |
          set -euo pipefail
          cat fixed/p01a fixed/p01b fixed/p01c fixed/p01d \
              app.part02 app.part03 app.part04 app.part05 app.part06 app.part07 \
              fixed/p08_1 fixed/p08_2a fixed/p08_2b fixed/p08_3 fixed/p08_4 fixed/p08_5 fixed/p08_6 fixed/p08_7 fixed/p08_8 \
              app.part09 app.part10 app.part11 | tr -d '\n\r ' | base64 -d | gzip -d > index.html
          test -s index.html
          test "$(wc -c < index.html)" -ge 230000
          grep -q "Dalla Simo" index.html
          grep -qi "<!doctype html" index.html

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          bg=(247,245,239,255)
          src=Image.open('icon-master-v3.png').convert('RGBA')

          def canvas_icon(size, ratio, out):
              canvas=Image.new('RGBA',(size,size),bg)
              target=int(size*ratio)
              im=src.copy()
              im.thumbnail((target,target),Image.Resampling.LANCZOS)
              x=(size-im.width)//2; y=(size-im.height)//2
              canvas.alpha_composite(im,(x,y))
              canvas.convert('RGB').save(out,'PNG',optimize=True)

          canvas_icon(192,0.84,'icon-192-v3.png')
          canvas_icon(512,0.84,'icon-512-v3.png')
          canvas_icon(512,0.70,'icon-maskable-512-v3.png')
          canvas_icon(180,0.84,'apple-touch-icon-v3.png')
          canvas_icon(512,0.88,'logo-dalla-simo-v3.png')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href="./manifest.webmanifest"','href="./manifest.webmanifest?v=20260907v3"')
          s=s.replace('href="./icon-192.png"','href="./apple-touch-icon-v3.png?v=20260907v3"')
          s=s.replace('href="logo-dalla-simo.png"','href="./icon-192-v3.png?v=20260907v3"')
          s=s.replace('src="./logo-dalla-simo.png"','src="./logo-dalla-simo-v3.png?v=20260907v3"')
          s=s.replace('src="./icon-512.png"','src="./logo-dalla-simo-v3.png?v=20260907v3"')
          s=s.replace('.brand-logo{width:48px;height:48px;object-fit:contain;flex:0 0 auto}', '.brand-logo{width:54px;height:54px;object-fit:contain;object-position:center;flex:0 0 auto}')
          s=s.replace('.hero-logo{width:110px;height:110px;object-fit:contain;display:block;margin:0 auto 8px}', '.hero-logo{width:148px;height:148px;object-fit:contain;object-position:center;display:block;margin:0 auto 8px}')
          p.write_text(s,encoding='utf-8')

          Path('manifest.webmanifest').write_text('''{
            "id": "./?pwa=dalla-simo-v3",
            "name": "Dalla Simo — Alimentazione familiare",
            "short_name": "Dalla Simo",
            "description": "Ricette, planner, lista della spesa, dispensa e registro pasti della famiglia.",
            "lang": "it-IT",
            "start_url": "./?pwa=dalla-simo-v3",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait-primary",
            "background_color": "#F7F5EF",
            "theme_color": "#5F7D63",
            "prefer_related_applications": false,
            "icons": [
              {"src":"./icon-192-v3.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"./icon-512-v3.png","sizes":"512x512","type":"image/png","purpose":"any"},
              {"src":"./icon-maskable-512-v3.png","sizes":"512x512","type":"image/png","purpose":"maskable"}
            ]
          }''',encoding='utf-8')

          Path('service-worker.js').write_text('''const C='dalla-simo-gh-v3-20260907';
          const A=['./','./index.html','./manifest.webmanifest','./icon-192-v3.png','./icon-512-v3.png','./icon-maskable-512-v3.png','./apple-touch-icon-v3.png','./logo-dalla-simo-v3.png'];
          self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.addAll(A)))});
          self.addEventListener('activate',e=>e.waitUntil(Promise.all([self.clients.claim(),caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x))))])));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const n=e.request.mode==='navigate';if(n){e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(C).then(x=>x.put('./index.html',c));return r}).catch(()=>caches.match('./index.html')));return;}e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(x=>{const y=x.clone();caches.open(C).then(c=>c.put(e.request,y));return x}))) });''',encoding='utf-8')
          PY

          echo "INDEX_OK bytes=$(wc -c < index.html)"
          file icon-192-v3.png icon-512-v3.png icon-maskable-512-v3.png logo-dalla-simo-v3.png

      - name: Pubblica app e icone v3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest service-worker.js icon-192-v3.png icon-512-v3.png icon-maskable-512-v3.png apple-touch-icon-v3.png logo-dalla-simo-v3.png
          if git diff --cached --quiet; then
            echo "App già aggiornata"
            exit 0
          fi
          git commit -m "[generated-v3] Pubblica icone definitive Dalla Simo"
          git push
