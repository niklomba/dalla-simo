name: Verifica Dalla Simo v1.26
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica sorgenti e quantità
        run: |
          for file in domain-core*.js service-worker.js; do node --check "$file"; done
          node tests/diet-portions.cjs
          node tests/included-diet.cjs
          node tests/v126-diet.cjs
          node tests/v126-diet-startup.cjs
          node tests/nutrition-v126.cjs
      # Distribuisce i sorgenti verificati senza rigenerare il vecchio loader.
