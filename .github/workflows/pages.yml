name: Pubblica Dalla Simo v1.12

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-v112:
    if: ${{ !contains(github.event.head_commit.message, '[generated-v112]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Prepara Pillow
        run: python -m pip install --quiet pillow

      - name: Genera solo icone Home v1.12
        shell: bash
        run: |
          set -euo pipefail
          test -s home-icon-v112.part01
          test -s home-icon-v112.part02
          test -s home-icon-v112.part03
          test -s home-icon-v112.part04
          test -s home-icon-v112.part05
          test -s index.html
          test -s brand-v111-512.png
          cat home-icon-v112.part01 home-icon-v112.part02 home-icon-v112.part03 home-icon-v112.part04 home-icon-v112.part05 > home-icon-v112.b64
          base64 -d home-icon-v112.b64 > home-icon-v112.jpg

          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, re

          src=Image.open('home-icon-v112.jpg').convert('RGB')
          for size,name in [(512,'icon-512-v112.png'),(192,'icon-192-v112.png'),(180,'apple-touch-icon-v112.png')]:
              src.resize((size,size),Image.Resampling.LANCZOS).save(name,'PNG',optimize=True)

          # L'app visibile resta identica alla v1.11: cambiano solo PWA/favicon.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<link rel="manifest" href="[^"]+">', '<link rel="manifest" href="./manifest.webmanifest?v=112">', s, count=1)
          s=re.sub(r'<link rel="icon" type="image/png" href="[^"]+">', '<link rel="icon" type="image/png" href="./icon-192-v112.png?v=112">', s, count=1)
          s=re.sub(r'<link rel="apple-touch-icon" href="[^"]+">', '<link rel="apple-touch-icon" href="./apple-touch-icon-v112.png?v=112">', s)
          p.write_text(s,encoding='utf-8')

          manifest={
            'id':'./?pwa=dalla-simo-v112',
            'name':'Dalla Simo — Alimentazione familiare',
            'short_name':'Dalla Simo',
            'description':'Dieta completa, ricette, ricetta rapida, planner e spesa familiare.',
            'lang':'it-IT','start_url':'./?pwa=dalla-simo-v112','scope':'./','display':'standalone',
            'orientation':'portrait-primary','background_color':'#F7F5EF','theme_color':'#5F7D63',
            'prefer_related_applications':False,
            'icons':[
              {'src':'./icon-192-v112.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'./icon-512-v112.png','sizes':'512x512','type':'image/png','purpose':'any'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')

          sw="""const C='dalla-simo-v112-20260908';
          const A=['./','./index.html','./manifest.webmanifest','./domain-core.js','./domain-core-v19.part1','./domain-core-v19.part2','./domain-core-v19.part3','./domain-core-v19.part4','./brand-v111-512.png','./icon-192-v112.png','./icon-512-v112.png','./apple-touch-icon-v112.png'];
          self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.addAll(A)))});
          self.addEventListener('activate',e=>e.waitUntil(Promise.all([self.clients.claim(),caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x))))])));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const n=e.request.mode==='navigate';if(n){e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(C).then(x=>x.put('./index.html',c));return r}).catch(()=>caches.match('./index.html')));return;}e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(x=>{const y=x.clone();caches.open(C).then(c=>c.put(e.request,y));return x}))) });
          """
          Path('service-worker.js').write_text(sw,encoding='utf-8')
          PY

      - name: Verifica che l'app interna sia invariata
        run: |
          file icon-192-v112.png icon-512-v112.png apple-touch-icon-v112.png
          grep -q 'dalla-simo-v112' manifest.webmanifest
          grep -q 'brand-v111-512.png' index.html
          grep -q 'Alimentazione familiare · v1.11' index.html
          grep -q 'icon-192-v112.png' index.html

      - name: Pubblica v1.12
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest service-worker.js icon-192-v112.png icon-512-v112.png apple-touch-icon-v112.png
          if git diff --cached --quiet; then
            echo "v1.12 già aggiornata"
            exit 0
          fi
          git commit -m "[generated-v112] Pubblica nuova icona Home Dalla Simo v1.12"
          git push
