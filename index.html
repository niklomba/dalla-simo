<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5F7D63"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Dalla Simo"><title>Dalla Simo</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"></head><body style="font-family:system-ui;background:#f7f5ef;color:#314232;display:grid;place-items:center;min-height:100vh;margin:0"><div style="text-align:center"><img src="./icon-192.png" alt="Dalla Simo" width="128" height="128" style="border-radius:24px"><p>Caricamento Dalla Simo…</p></div><script>
(async()=>{try{const t=await fetch('./app.html.gz.b64',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('download');return r.text()});const bin=Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const decompressed=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(decompressed);document.close()}catch(e){document.body.innerHTML='<main style="padding:24px"><h1>Dalla Simo</h1><p>Impossibile caricare l’app. Controlla la connessione e ricarica la pagina.</p></main>'}})();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}</script></body></html>
